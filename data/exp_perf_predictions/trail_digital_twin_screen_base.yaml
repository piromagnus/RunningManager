paths:
  data_dir: data
  timeseries_dir: data/timeseries
  metrics_ts_dir: data/metrics_ts
  raw_strava_dir: data/raw/strava
  output_dir: /tmp/trail_digital_twin_screen_base

cohorts:
  include:
    - hardTrailRun
    - hardRunOrTrailRun
  top_hrr_count: 10
  selected_race_dates: []

physiology:
  segment_km: 1.0
  vma_flat_kmh: 18.0
  vt2_threshold_name: Threshold 30
  vt2_fallback_kmh: 15.0
  hrr_reference: 0.70
  hrr_min_factor: 0.30
  hrr_max_factor: 1.00
  trimp_scale: 10.0
  decay_lambda: 0.30
  min_fatigue_factor: 0.50

readiness:
  ctl_weight: 0.05
  tsb_weight: 0.10
  ctl_factor_min: 0.90
  ctl_factor_max: 1.10

fitting:
  enabled_objectives:
    - activity
  validation_modes:
    - in_sample
  stage0_alpha_grid:
    - 0.70
  stage0_mu_grid:
    - 0.00
  hrr_trimp_alpha_grid:
    - 0.45
    - 0.55
    - 0.65
    - 0.75
  hrr_trimp_kappa_grid:
    - 0.00
    - 0.05
    - 0.10
    - 0.20
    - 0.40
  fatigue_models:
    - linear
    - exponential
  stage3_fatigue_states:
    - fatigue_state: decayed
      acute_trimp_col: decayedTrimpBefore
      label: decayed TRIMP
    - fatigue_state: cumulative
      acute_trimp_col: cumTrimpBefore
      label: cumulative TRIMP

segment_grid:
  enabled: false
  alpha_grid:
    - 0.50
  mu_grid:
    - 0.00
  terrain_multiplier_grid:
    - flat: 1.00
      climb: 1.00
      steep_climb: 1.00
      descent: 1.00
      steep_descent: 1.00
      mixed_climb_descent: 1.00
  technicality_coef_grid:
    - 0.00
  hr_coef_grid:
    - 0.00
  acute_trimp_coef_grid:
    - 0.00

robustness:
  enabled: false
  trimp_scales:
    - 10.0
  hrr_references:
    - 0.70
  decay_lambdas:
    - 0.30
  elapsed_time_sensitivity: false
  segment_length_sensitivity: false
  segment_length_km: 0.50

outputs:
  write_csv: false
  write_html: false
  write_png: false
  self_contained_html: true
  privacy_mode: local
  html_filename: trail_digital_twin_report.html
