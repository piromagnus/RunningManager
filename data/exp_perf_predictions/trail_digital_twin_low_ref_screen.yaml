execution:
  output_dir: /tmp/trail_digital_twin_low_ref_screen
  per_run_csv: false
  per_run_html: false
  disable_inner_robustness: true
  disable_inner_segment_grid: true
  write_html: true
  fail_fast: false

selection:
  primary_stage: Stage 3 HRR speed ratio
  fallback_stage: Stage 3 HRR speed ratio
  aggregate_objectives:
    - activity
  aggregate_cohorts:
    - hardTrailRun
    - hardRunOrTrailRun

groups:
  - id: low_hrr_reference_bounds
    mode: grid
    description: In-sample screen for low HRR references and HRR multiplier clipping.
    overrides:
      physiology.hrr_reference:
        - 0.30
        - 0.40
        - 0.50
        - 0.60
        - 0.70
      physiology.hrr_min_factor:
        - 0.20
        - 0.40
      physiology.hrr_max_factor:
        - 1.00
        - 1.30
        - 1.60
