execution:
  output_dir: data/exp_perf_predictions/trail_digital_twin_best_factor_sweep
  per_run_csv: false
  per_run_html: false
  disable_inner_robustness: true
  disable_inner_segment_grid: true
  write_html: true
  fail_fast: false
  jobs: 24
  common_overrides:
    fitting.enabled_objectives:
      - activity
    fitting.validation_modes:
      - in_sample
      - loo
    readiness.ctl_weight: 0.05
    readiness.tsb_weight: 0.10
    physiology.hrr_reference: 0.85
    physiology.hrr_min_factor: 0.30
    physiology.hrr_max_factor: 1.20
    physiology.decay_lambda: 0.25
    physiology.min_fatigue_factor: 0.50

selection:
  primary_stage: Stage 3 HRR speed ratio LOO
  fallback_stage: Stage 3 HRR speed ratio
  aggregate_objectives:
    - activity
  aggregate_cohorts:
    - hardTrailRun
    - hardRunOrTrailRun
    - top10HardTrailByHRR
    - selectedDateRaces

groups:
  - id: best_setup_anchor
    mode: anchor
    description: Best-known high-reference setup before fatigue-floor and decay sweeps.
    runs:
      - name: hrr085_clip030_120_decay025_floor050
        overrides: {}

  - id: min_fatigue_factor_sweep
    mode: grid
    description: Fatigue-floor sweep from no floor to no fatigue penalty under the best-known setup.
    overrides:
      physiology.min_fatigue_factor:
        - 0.00
        - 0.10
        - 0.20
        - 0.30
        - 0.40
        - 0.50
        - 0.60
        - 0.70
        - 0.80
        - 0.90
        - 1.00

  - id: decay_lambda_sweep_hrr085
    mode: grid
    description: In-activity decayed-TRIMP lambda sweep at HRR reference 0.85.
    overrides:
      physiology.hrr_reference:
        - 0.85
      physiology.decay_lambda:
        - 0.00
        - 0.05
        - 0.10
        - 0.15
        - 0.20
        - 0.25
        - 0.30
        - 0.35
        - 0.40
        - 0.45
        - 0.50
